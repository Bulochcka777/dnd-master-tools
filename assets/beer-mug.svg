<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Wood gradient -->
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5E3C"/>
      <stop offset="40%" stop-color="#6B3A2A"/>
      <stop offset="100%" stop-color="#4A2410"/>
    </linearGradient>
    <!-- Beer gradient -->
    <linearGradient id="beer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5c842"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>
    <!-- Foam gradient -->
    <linearGradient id="foam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="100%" stop-color="#f0e0b8"/>
    </linearGradient>
    <!-- Golden glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Outer glow -->
    <filter id="outerGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feFlood flood-color="#c9a84c" flood-opacity="0.4"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Golden magic glow behind mug -->
  <ellipse cx="55" cy="70" rx="35" ry="40" fill="#c9a84c" opacity="0.08" filter="url(#outerGlow)"/>

  <!-- Mug body -->
  <path d="M25 38 L25 92 Q25 100 33 100 L77 100 Q85 100 85 92 L85 38 Z"
        fill="url(#wood)" stroke="#3a1a08" stroke-width="2"/>

  <!-- Wood grain lines -->
  <line x1="38" y1="40" x2="38" y2="98" stroke="#5a3018" stroke-width="0.8" opacity="0.5"/>
  <line x1="50" y1="40" x2="50" y2="98" stroke="#5a3018" stroke-width="0.8" opacity="0.4"/>
  <line x1="62" y1="40" x2="62" y2="98" stroke="#5a3018" stroke-width="0.8" opacity="0.5"/>
  <line x1="74" y1="40" x2="74" y2="98" stroke="#5a3018" stroke-width="0.8" opacity="0.3"/>

  <!-- Metal bands -->
  <rect x="23" y="45" width="64" height="5" rx="1" fill="#8a7230" stroke="#6b5a20" stroke-width="0.5" opacity="0.9"/>
  <rect x="23" y="80" width="64" height="5" rx="1" fill="#8a7230" stroke="#6b5a20" stroke-width="0.5" opacity="0.9"/>
  <!-- Band rivets -->
  <circle cx="30" cy="47.5" r="1.5" fill="#c9a84c"/>
  <circle cx="55" cy="47.5" r="1.5" fill="#c9a84c"/>
  <circle cx="80" cy="47.5" r="1.5" fill="#c9a84c"/>
  <circle cx="30" cy="82.5" r="1.5" fill="#c9a84c"/>
  <circle cx="55" cy="82.5" r="1.5" fill="#c9a84c"/>
  <circle cx="80" cy="82.5" r="1.5" fill="#c9a84c"/>

  <!-- Beer liquid -->
  <rect x="28" y="42" width="54" height="43" rx="2" fill="url(#beer)" opacity="0.85"/>
  <!-- Beer highlight -->
  <rect x="30" y="44" width="15" height="38" rx="2" fill="#f5d060" opacity="0.3"/>

  <!-- Foam -->
  <ellipse cx="55" cy="38" rx="32" ry="8" fill="url(#foam)" stroke="#e8d8a8" stroke-width="0.5"/>
  <!-- Foam bubbles top -->
  <circle cx="40" cy="32" r="6" fill="#fff8e8" opacity="0.9"/>
  <circle cx="52" cy="29" r="7" fill="#fff8e8" opacity="0.85"/>
  <circle cx="65" cy="31" r="6.5" fill="#fff8e8" opacity="0.9"/>
  <circle cx="45" cy="27" r="4" fill="#fffef5" opacity="0.8"/>
  <circle cx="58" cy="25" r="5" fill="#fffef5" opacity="0.75"/>
  <circle cx="72" cy="28" r="4" fill="#fff8e8" opacity="0.7"/>
  <circle cx="35" cy="30" r="3.5" fill="#fffef5" opacity="0.7"/>

  <!-- Handle -->
  <path d="M85 48 Q100 48 100 65 Q100 82 85 82"
        fill="none" stroke="url(#wood)" stroke-width="8" stroke-linecap="round"/>
  <path d="M85 48 Q100 48 100 65 Q100 82 85 82"
        fill="none" stroke="#3a1a08" stroke-width="9" stroke-linecap="round" opacity="0.3"/>
  <path d="M85 48 Q99 48 99 65 Q99 82 85 82"
        fill="none" stroke="#8B5E3C" stroke-width="6" stroke-linecap="round"/>

  <!-- Sparkles -->
  <g filter="url(#glow)" opacity="0.8">
    <polygon points="18,22 19.5,18 21,22 19.5,26" fill="#f5c842"/>
    <polygon points="16,22 20,20.5 16,19 12,20.5" fill="#f5c842" transform="rotate(0,18,22)"/>
  </g>
  <g filter="url(#glow)" opacity="0.6">
    <polygon points="90,15 91,12 92,15 91,18" fill="#c9a84c"/>
    <polygon points="88.5,15 91,13.5 93.5,15 91,16.5" fill="#c9a84c"/>
  </g>
  <g filter="url(#glow)" opacity="0.5">
    <polygon points="15,60 16,58 17,60 16,62" fill="#f5c842"/>
    <polygon points="13.5,60 16,59 18.5,60 16,61" fill="#f5c842"/>
  </g>
</svg>
